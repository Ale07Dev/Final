name: Build FitnessTracker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Works whether the project is committed as normal files OR as a .zip in the repo root.
      # Any old "extracted" folder is wiped first so stale files can never be compiled.
      - name: Locate project
        run: |
          set -euo pipefail
          rm -rf extracted
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            mkdir extracted
            unzip -q "$ZIP" -d extracted
            SEARCH=extracted
          else
            SEARCH=.
          fi
          GRADLEW=$(find "$SEARCH" -name gradlew -type f | head -n1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # Android Gradle Plugin 8.x needs JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          # Optional repository secret. If unset, the URL in app/build.gradle.kts is used.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitnessTracker-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
